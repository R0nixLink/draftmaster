<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crownfall DraftMaster</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap');

    :root {
      --bg-main: #06070a;
      --bg-card: #121318;
      --border-color: #2a2c36;
      --accent-gold: #e2c070;
      --accent-gold-dark: #b89853;
      --accent-green: #2ecc71;
      --accent-blue: #3498db;
      --dire-red: #e74c3c;
      --text-light: #f5f6fa;
      --text-muted: #8b8d99;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-light); padding-bottom: 85px; min-height: 100vh; overflow-x: hidden; }

    /* ТОП ХЕДЕР */
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #000; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;}
    .top-bar .title { font-size: 18px; font-weight: 900; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(226,192,112,0.3); }
    .top-bar .menu-icon { font-size: 20px; color: var(--text-muted); cursor: pointer; transition: transform 0.2s;}
    .top-bar .menu-icon:active { transform: rotate(90deg); }

    /* БАННЕР ПРОФИЛЯ */
    .profile-banner { margin: 15px 20px; padding: 15px; background: linear-gradient(145deg, #181a24 0%, #0a0b10 100%); border: 1px solid #352a1a; border-radius: 16px; display: flex; align-items: center; gap: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
    .profile-banner::after { content: ''; position: absolute; right: -20px; top: -20px; width: 100px; height: 100px; background: radial-gradient(circle, rgba(226,192,112,0.15) 0%, rgba(0,0,0,0) 70%); }
    .banner-avatar { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--accent-gold); object-fit: cover; z-index: 2; }
    .banner-avatar-fallback { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-dark)); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; color: #000; z-index: 2; border: 2px solid #000;}
    .banner-info { z-index: 2; flex: 1; }
    .banner-info h3 { font-size: 17px; margin-bottom: 4px; font-weight: 800; display: flex; align-items: center; gap: 6px;}
    .banner-info p { font-size: 11px; color: var(--text-muted); font-weight: 600;}

    .currency-row { display: flex; justify-content: space-between; margin: 0 20px 20px; background: #0d0f14; border: 1px solid var(--border-color); border-radius: 12px; padding: 10px 15px; }
    .curr-item { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; }
    .curr-item .dot { width: 12px; height: 12px; border-radius: 50%; }

    .section-header { margin: 0 20px 12px; font-size: 14px; font-weight: 800; text-transform: uppercase; color: var(--text-light); }

    /* ГРИД КАРТОЧЕК МЕНЮ */
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 20px 20px; }
    .menu-card { position: relative; height: 100px; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); background: var(--bg-card); transition: transform 0.1s; }
    .menu-card:active { transform: scale(0.96); border-color: var(--accent-gold); }
    .menu-card .bg-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.5; z-index: 0; }
    .menu-card::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.1) 100%); z-index: 1; }
    .menu-card .content { position: relative; z-index: 2; }
    .menu-card h4 { font-size: 13px; font-weight: 800; color: #fff; margin-bottom: 2px; }
    .menu-card p { font-size: 9px; color: var(--accent-gold); font-weight: 600; text-transform: uppercase;}

    /* НИЖНЯЯ ПАНЕЛЬ */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10, 11, 16, 0.98); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 12px 0 25px; z-index: 1000; }
    .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 10px; font-weight: 600; cursor: pointer; flex: 1; transition: color 0.2s; }
    .nav-btn.active { color: var(--accent-gold); }
    .nav-btn .icon { font-size: 20px; margin-bottom: 2px;}

    /* СЕКЦИИ */
    .section-wrapper { display: none; padding: 20px; animation: fadeIn 0.3s ease; }
    .section-wrapper.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .page-title { font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 20px; text-transform: uppercase; border-left: 4px solid var(--accent-gold); padding-left: 10px; line-height: 1;}

    /* ОНБОРДИНГ */
    .onboarding-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(6, 7, 10, 0.98); z-index: 999999; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .onboarding-overlay.active { display: flex; }
    .onboarding-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 30px 20px; width: 100%; max-width: 340px; }
    .onboarding-step { display: none; animation: fadeIn 0.3s ease; }
    .onboarding-step.active { display: block; }
    .onboarding-card h2 { color: #fff; margin-bottom: 8px; font-size: 22px; font-weight: 900; text-transform: uppercase;}
    .onboarding-card p { font-size: 12px; color: var(--text-muted); margin-bottom: 25px; line-height: 1.4;}
    .ob-input { width: 100%; background: #0a0b10; border: 1px solid var(--border-color); color: #fff; padding: 15px; border-radius: 12px; margin-bottom: 12px; text-align: center; font-size: 16px; font-weight: bold; outline: none;}
    .ob-btn { background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-dark) 100%); color: #000; border: none; padding: 14px 20px; width: 100%; border-radius: 12px; font-weight: 900; cursor: pointer; font-size: 15px; margin-top: 10px; text-transform: uppercase; }
    .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .role-select-btn { background: #0a0b10; border: 1px solid var(--border-color); color: var(--text-muted); padding: 12px; border-radius: 10px; font-size: 12px; font-weight: 800; cursor: pointer; }
    .role-select-btn.selected { background: rgba(226,192,112,0.1); color: var(--accent-gold); border-color: var(--accent-gold); }

    /* ДРАФТ */
    .teams-container { display: flex; flex-direction: column; gap: 15px; }
    .team-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 12px; }
    .slot-row { display: flex; align-items: center; margin-bottom: 8px; gap: 10px; background: #0a0b10; border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 10px; cursor: pointer; }
    .slot-label { font-size: 11px; color: var(--text-muted); width: 85px; font-weight: 800; flex-shrink: 0; text-transform: uppercase; }
    .slot-hero-img { width: 44px; height: 24px; border-radius: 4px; object-fit: cover; background: #000; flex-shrink: 0; border: 1px solid #222; }
    .slot-hero-name { flex: 1; font-size: 13px; font-weight: 800; color: #fff; }
    .slot-hero-name.empty { color: #4a4d57; font-weight: 600; }
    .btn-row { display: flex; gap: 10px; margin-top: 15px; }
    .btn-analyze { flex: 3; background: linear-gradient(135deg, #11998e, #2ecc71); color: #fff; border: none; border-radius: 10px; padding: 14px; font-weight: 900; font-size: 14px; cursor: pointer; text-transform: uppercase; }
    .btn-reset { flex: 1; background: #1a1c23; color: var(--text-light); border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; font-size: 13px; cursor: pointer; font-weight: bold;}
    .analysis-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 15px; margin-top: 15px; display: none; }
    .winrate-bar-container { background: #000; border-radius: 8px; height: 24px; overflow: hidden; display: flex; margin: 12px 0; border: 1px solid #222;}
    .winrate-radiant { background: linear-gradient(90deg, #11998e, #2ecc71); height: 100%; text-align: center; font-size: 11px; line-height: 24px; font-weight: 900; color: #fff; }
    .winrate-dire { background: linear-gradient(90deg, #c0392b, #e74c3c); height: 100%; text-align: center; font-size: 11px; line-height: 24px; font-weight: 900; color: #fff; }

    /* МОДАЛКА ГЕРОЕВ (ОЧИЩЕННЫЕ КАРТОЧКИ) */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(6, 7, 10, 0.98); z-index: 999999; display: none; flex-direction: column; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-shrink: 0; }
    .modal-role-title { font-size: 16px; font-weight: 900; color: #fff; text-transform: uppercase;}
    .modal-close { background: #1a1c23; border: 1px solid var(--border-color); color: #fff; padding: 8px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    .modal-search { background: #121318; border: 1px solid var(--border-color); border-radius: 10px; padding: 15px; color: #fff; outline: none; font-size: 14px; margin-bottom: 15px; flex-shrink: 0; font-weight: bold; width: 100%;}
    .role-filters { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 15px; padding-bottom: 5px; flex-shrink: 0; scrollbar-width: none; }
    .role-btn { background: #121318; border: 1px solid var(--border-color); color: var(--text-muted); font-size: 11px; padding: 8px 12px; border-radius: 8px; white-space: nowrap; cursor: pointer; font-weight: 800;}
    .role-btn.active { background: var(--accent-gold-dark); color: #fff; border-color: var(--accent-gold); }
    
    .heroes-grid-container { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; align-content: start; padding-bottom: 40px; }
    .hero-pick-card { background: transparent; border-radius: 8px; overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: transform 0.1s;}
    .hero-pick-card:active { transform: scale(0.9); }
    .hero-pick-card.disabled { opacity: 0.2; pointer-events: none; }
    .hero-pick-card img { width: 100%; height: 50px; object-fit: cover; display: block; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.5);}

    /* DOTABUFF КОНТРПИКИ */
    .counters-grid { display: flex; flex-direction: column; gap: 20px; margin-top: 15px; }
    .counters-col h4 { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; font-weight: bold; padding-bottom: 5px; border-bottom: 1px solid var(--border-color); }
    .counter-item-row { display: flex; align-items: center; background: #0f1015; border-bottom: 1px solid var(--border-color); padding: 8px; border-radius: 8px; margin-bottom: 6px;}
    .counter-item-hero { display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden; }
    .counter-item-hero img { width: 45px; height: 26px; border-radius: 4px; object-fit: cover; border: 1px solid #000; flex-shrink: 0; }
    .counter-item-hero span { font-size: 12px; font-weight: 900; color: #fff; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;}
    .counter-item-stats { display: flex; align-items: center; gap: 12px; flex-shrink: 0;}
    .counter-item-stats .adv { font-size: 12px; font-weight: 900; width: 50px; text-align: right; }
    .counter-item-stats .wr-container { display: flex; flex-direction: column; align-items: flex-end; width: 65px; }
    .counter-item-stats .wr-text { font-size: 11px; font-weight: bold; margin-bottom: 4px;}
    .counter-item-stats .bar-bg { width: 100%; height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
    .counter-item-stats .bar-fill { height: 100%; border-radius: 3px;}

    /* СБОРКИ */
    .build-item-slot { width: 45px; height: 35px; background: #0a0b10; border: 1px solid var(--border-color); border-radius: 6px; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 2px 5px rgba(0,0,0,0.8); }
    .build-item-slot img { width: 100%; height: 100%; object-fit: cover; border-radius: 5px; }

    /* АНАЛИЗ ИГРОКОВ */
    .analyzer-input-group { display: flex; gap: 8px; margin-bottom: 20px; }
    .analyzer-input-group input { flex:1; background:#0a0b10; border:1px solid var(--border-color); color:#fff; padding:15px; border-radius:12px; outline:none; font-weight:bold; font-size: 14px;}
    .analyzer-input-group button { background: var(--accent-blue); color: #fff; border: none; padding: 0 20px; border-radius: 12px; font-weight: 900; cursor: pointer; text-transform: uppercase;}
    .info-btn { background: linear-gradient(135deg, var(--accent-blue), #2980b9); border: none; color: #fff; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; cursor: pointer; font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.5);}

    /* МЕТА И РАНГИ */
    .meta-hero-row { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
    .meta-hero-img { width: 60px; height: 34px; border-radius: 6px; object-fit: cover; border: 1px solid #000;}
    .meta-hero-stats { margin-top: 4px; display: flex; gap: 15px;}
    .meta-hero-stats span { font-size: 10px; color: var(--text-muted); font-weight: 600;}
    .meta-hero-stats b { color: #fff;}

    .rank-dropdown-content { position: absolute; right: 20px; top: 70px; background: #0a0b10; border: 1px solid var(--border-color); border-radius: 12px; display: none; flex-direction: column; z-index: 10; overflow: hidden; width: 160px; box-shadow: 0 10px 20px rgba(0,0,0,0.5);}
    .rank-dropdown-content.show { display: flex; }
    .rank-option { padding: 12px; font-size: 12px; color: var(--text-light); cursor: pointer; border-bottom: 1px solid var(--border-color
